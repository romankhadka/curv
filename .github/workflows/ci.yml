name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Build the app bundle
        run: ./build.sh
      - name: Verify the bundle
        run: |
          codesign --verify --strict --deep build/Curv.app
          test -x build/Curv.app/Contents/Resources/fancurved
